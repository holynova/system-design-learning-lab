<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">系统设计实验册 — 动手注入故障，读懂分布式机制</title>
  <desc id="desc">米白纸底标题：系统设计实验册，副标题读懂机制，再谈论架构；右侧是三个副本节点 A、B 是新值 v2，C 还是旧值 v1，读请求只命中 C 就读到旧值。</desc>

  <rect width="1200" height="360" rx="26" fill="#f7f5ef"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#5a6b5e">系统设计面试实验台 · SYSTEM DESIGN LAB</text>
    <text x="56" y="128" font-size="62" font-weight="700" fill="#1f2a22">系统设计实验册</text>
    <text x="56" y="168" font-size="23" fill="#1d5c3d">读懂机制，再谈论架构</text>
    <text x="56" y="204" font-size="19" fill="#5a6b5e">动手注入故障：写成功了，为什么还读到旧值？</text>
    <g id="chips" font-size="18" fill="#1f2a22" text-anchor="middle">
      <g><rect x="56" y="238" width="138" height="36" rx="18" fill="#eef0e9" stroke="#c8d2c4" stroke-width="1.5"/><text x="125" y="262">3 个交互实验</text></g>
      <g><rect x="206" y="238" width="126" height="36" rx="18" fill="#eef0e9" stroke="#c8d2c4" stroke-width="1.5"/><text x="269" y="262">28 章精讲</text></g>
      <g><rect x="344" y="238" width="150" height="36" rx="18" fill="#eef0e9" stroke="#c8d2c4" stroke-width="1.5"/><text x="419" y="262">零后端纯前端</text></g>
      <g><rect x="506" y="238" width="126" height="36" rx="18" fill="#eef0e9" stroke="#c8d2c4" stroke-width="1.5"/><text x="569" y="262">故障注入</text></g>
    </g>
  </g>

  <g id="replica-diagram" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g id="node-a">
      <rect x="792" y="72" width="96" height="96" rx="14" fill="#1d5c3d"/>
      <text x="840" y="112" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
      <text x="840" y="144" font-size="20" fill="#cde8d4" text-anchor="middle">x=2 · v2</text>
    </g>
    <g id="node-b">
      <rect x="900" y="72" width="96" height="96" rx="14" fill="#1d5c3d"/>
      <text x="948" y="112" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
      <text x="948" y="144" font-size="20" fill="#cde8d4" text-anchor="middle">x=2 · v2</text>
    </g>
    <g id="node-c">
      <rect x="1008" y="72" width="96" height="96" rx="14" fill="#fdf3ec" stroke="#b0563f" stroke-width="2.5" stroke-dasharray="7 5"/>
      <text x="1056" y="112" font-size="30" font-weight="700" fill="#8f3a26" text-anchor="middle">C</text>
      <text x="1056" y="144" font-size="20" fill="#8f3a26" text-anchor="middle">x=1 · v1</text>
    </g>
    <g id="read-arrow">
      <line x1="1056" y1="184" x2="1056" y2="218" stroke="#b0563f" stroke-width="3" stroke-linecap="round"/>
      <polygon points="1056,230 1044,210 1068,210" fill="#b0563f"/>
    </g>
    <g id="read-result">
      <rect x="936" y="242" width="240" height="44" rx="12" fill="#fdf3ec" stroke="#e8b4a8" stroke-width="1.5"/>
      <text x="1056" y="270" font-size="19" fill="#7a2d20" text-anchor="middle">只读 C → 读到旧值 v1</text>
    </g>
    <text x="948" y="322" font-size="18" fill="#5a6b5e" text-anchor="middle">R + W &gt; N 时，读修复把 C 追回 v2</text>
  </g>
</svg>
